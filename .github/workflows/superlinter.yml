name: Windows Build
on: [push,pull_request,check_run]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.1.5
      - run: |
          haxelib install hxnodejs
          haxelib install lime 7.9.0 --skip-dependencies
          haxelib install openfl 9.2.0 --skip-dependencies
          haxelib install flixel 4.11.0 --skip-dependencies
          haxelib run lime setup
          haxelib run lime setup flixel
          haxelib install flixel-tools 1.5.1 --skip-dependencies
          haxelib run flixel-tools setup
          haxelib install flixel-addons 2.11.0 --skip-dependencies
          haxelib install flixel-ui 2.5.0 --skip-dependencies
          haxelib install hscript 2.5.0 --skip-dependencies
          haxelib install newgrounds 1.1.4 --skip-dependencies
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git
          haxelib git faxe https://github.com/uhrobots/faxe
          haxelib git polymod https://github.com/larsiusprime/polymod.git
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --skip-dependencies
          haxelib list
          lime build windows
      - uses: actions/upload-artifact@v4
        with:
          name: Windows Build
          path: export/release/windows/bin
